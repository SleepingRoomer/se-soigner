        (it.w?"<h4>"+esc(t("res.where"))+"</h4><p>"+esc(t(it.w))+"</p>":"")+"</div>":"";
      var link=PRO[it.id]?'<button type="button" class="toggle" data-fiche="'+it.id+'">'+esc(t("res.more"))+flip("chev",20)+"</button>":"";
      if(it.id==="pass"||it.id==="suv")link='<button type="button" class="toggle" data-lieu="pass">'+svg("pin",20)+esc(t("res.near"))+"</button>"+link;
      return '<li class="rcard"><div class="rhead">'+icc(AID_ICON[it.id],true)+"<h3>"+esc(t("pl."+it.id))+'</h3></div><span class="pill '+it.st+'">'+svg(ST_ICON[it.st],20,2.6)+esc(t("st."+it.st))+"</span>"+body+'<div class="rbtns">'+more.split('<div class="more"')[0]+link+"</div>"+(hasMore?'<div class="more"'+more.split('<div class="more"')[1]:"")+"</li>";
    }).join("")+"</ol>";
  }
  if(r.notes.length)h+='<div class="notes"><h3>'+svg("info",24)+esc(t("res.notes"))+"</h3><ul>"+r.notes.map(function(k){return "<li>"+esc(t(k))+"</li>";}).join("")+"</ul></div>";
  if(r.no.length)h+='<div class="notapply"><b>'+esc(t("res.notapply"))+"</b>"+r.no.map(function(n){return "<p>"+esc(t("pl."+n[0]))+" : "+esc(t(n[1]))+"</p>";}).join("")+"</div>";
  h+='<p class="disclaimer">'+esc(t("res.disclaimer"))+'</p><div class="actions"><button type="button" class="btn sec" data-act="edit">'+esc(t("res.edit"))+'</button><button type="button" class="btn sec" data-act="restart">'+esc(t("res.restart"))+"</button></div>";
  return h;
}

function row(attr,ic,title,sub,extra){return '<li><button type="button" class="row" '+attr+'>'+icc(ic,true)+'<span class="txt"><b>'+esc(title)+"</b><small>"+esc(sub)+"</small>"+(extra||"")+"</span>"+flip("chev",26)+"</button></li>";}
function leaflet(){
  var mine=LEAF.filter(function(x){return x[0]===L;})[0];
  var a=function(x,cls){return '<a'+(cls?' class="'+cls+'"':"")+' href="'+LEAF_BASE+x[3]+'.pdf" target="_blank" rel="noopener" lang="'+x[1]+'">'+esc(x[2])+"</a>";};
  return '<section class="lf"><h2>'+svg("book",26)+"<span>"+esc(t("lf.title"))+"</span></h2><p>"+esc(t("lf.sub"))+'</p><p class="grp-h">'+esc(t("lf.yours"))+'</p><div class="langs-list">'+a(mine,"mine")+'</div><p class="grp-h">'+esc(t("lf.others"))+'</p><div class="langs-list">'+LEAF.filter(function(x){return x!==mine;}).map(function(x){return a(x);}).join("")+"</div></section>";
}
function vAides(){
  return backBtn("nav.home","home")+'<div class="view-head"><h1 tabindex="-1" class="vfocus">'+esc(t("nav.aides"))+'</h1><p class="lead">'+esc(t("home.aides.sub"))+"</p></div>"+
    '<h2 class="grp-h">'+esc(t("grp.understand"))+'</h2><ul class="rows">'+row('data-info="dr"',"scale",t("dr.title"),t("dr.sub"))+row('data-info="rb"',"euro",t("rb.title"),t("rb.sub"))+"</ul>"+
    '<h2 class="grp-h">'+esc(t("grp.aides"))+'</h2><ul class="rows">'+ORDER.map(function(id){return row('data-fiche="'+id+'"',AID_ICON[id],t("pl."+id),t(id+".what"));}).join("")+"</ul>"+leaflet();
}
function vInfo(){
  var k=INFO,blocks=k==="dr"?["dr1","dr2","dr3","dr4"]:["rb1","rb2","rb3","rb4"];
  return backBtn("nav.aides","aides")+'<div class="rhead">'+icc(k==="dr"?"scale":"euro")+'<h1 tabindex="-1" class="vfocus" style="font-size:clamp(1.5rem,4.5vw,2rem)">'+esc(t(k+".title"))+"</h1></div>"+
    blocks.map(function(b){return '<div class="fblock"><h3>'+esc(t(b+"t"))+"</h3><p>"+esc(t(b))+"</p></div>";}).join("");
}
function locBox(){
  if(LOC&&LOC.label)return '<div class="locbox"><div class="locset"><p>'+svg("pin",24)+"<span>"+esc(fmt("loc.set",{x:LOC.label}))+'</span></p><button type="button" class="toggle" data-act="locchange">'+esc(t("loc.change"))+"</button></div></div>";
  var st="";
  if(LOC&&LOC.status==="loading")st='<p class="note-s" role="status">'+esc(t("loc.loading"))+"</p>";
  if(LOC&&LOC.status==="notfound")st='<p role="alert" style="font-weight:600;color:var(--urgent)">'+esc(t("loc.notfound"))+"</p>";
  if(LOC&&LOC.status==="choose")st='<p style="font-weight:600">'+esc(t("loc.choose"))+'</p><div class="actions">'+LOC.cands.map(function(c,i){return '<button type="button" class="btn sec" data-pick="'+i+'">'+esc(c[0]+" ("+c[2]+")")+"</button>";}).join("")+"</div>";
  return '<form class="locbox" id="locform" novalidate><label for="loc">'+esc(t("loc.label"))+'</label><div class="locrow"><input id="loc" type="text" autocomplete="off" value="'+esc(LOC&&LOC.text?LOC.text:"")+'"><button class="btn" type="submit">'+esc(t("loc.ok"))+"</button></div>"+st+'<p class="private">'+svg("lock",20)+"<span>"+esc(t("loc.private"))+"</span></p></form>";
}
function vLieux(){
  var rows=function(g){return '<ul class="rows">'+NEEDS.filter(function(n){return n.grp===g;}).map(function(n){
    var extra="";
    if(LOC&&LOC.lat!==undefined){var nn=nearest(n,1);if(nn.length)extra='<small style="color:var(--accent);font-weight:700">'+esc(fmt("near.closest",{d:fmtKm(nn[0][0])}))+"</small>";}
    return row('data-lieu="'+n.id+'"',n.ic,t("need."+n.id),t("need."+n.id+".d"),extra);
  }).join("")+"</ul>";};
  return backBtn("nav.home","home")+'<div class="view-head"><h1 tabindex="-1" class="vfocus">'+esc(t("home.lieux"))+'</h1><p class="lead">'+esc(t("home.lieux.sub"))+"</p></div>"+
    locBox()+'<h2 class="grp-h">'+esc(t("grp.common"))+"</h2>"+rows(1)+'<h2 class="grp-h">'+esc(t("grp.special"))+"</h2>"+rows(2);
}
function vLieu(){
  var n=needById(LIEU),h="";
  h+=backBtn(FROM_L==="sim"?"res.title":"home.lieux",FROM_L==="sim"?"tores":"lieux");
  h+='<div class="rhead">'+icc(n.ic)+'<h1 tabindex="-1" class="vfocus" style="font-size:clamp(1.5rem,4.5vw,2rem)">'+esc(t("need."+n.id))+"</h1></div>";
  if(n.free)h+='<span class="badge">'+svg("ok",20,2.6)+esc(t("free.badge"))+"</span>";
  h+='<div class="fblock"><p>'+esc(t("need."+n.id+".d"))+"</p>"+(n.more?'<p style="font-size:1rem;color:var(--ink-2)">'+esc(t("need."+n.id+".m"))+"</p>":"")+"</div>";
  if(n.nums)h+='<div class="big-nums" aria-label="15, 112, 114"><span>15</span><span>112</span><span>114</span></div><p class="box">'+esc(t("urgent"))+" "+esc(t("num114"))+" : 114.</p>";
  h+=locBox();
  var where=LOC&&LOC.city?LOC.city:"";
  h+='<div class="actions"><a class="btn" href="'+gmaps(n.q+(where?" "+where:""))+'" target="_blank" rel="noopener">'+svg("pin",22)+esc(where?fmt("map.btn",{x:LOC.label}):t("map.btn0"))+svg("ext",18)+'</a></div><p class="note-s">'+esc(t("map.note"))+"</p>";
  if(n.keys.length){
    if(!LOC||!LOC.label)h+='<p class="note-s">'+esc(t("near.ask"))+"</p>";
    else if(DATA===null||LOC.lat===undefined)h+='<p class="note-s">'+esc(t("near.nodata"))+"</p>";
    else{
      var all=nearest(n),lim=MORE[n.id]||3,list=all.slice(0,lim);
      h+='<h2 class="sub-h">'+esc(t("near.title"))+"</h2>";
      if(!list.length)h+="<p>"+esc(t("near.none"))+"</p>";
      else{
        h+='<ul class="places">'+list.map(function(x){var p=x[1];
          return "<li><b>"+esc(p[1])+(p[0]==="psyenf"?" · "+esc(t("near.child")):"")+'</b><span class="addr">'+esc([p[2],(p[3]+" "+p[4]).trim()].filter(Boolean).join(", "))+'</span><span class="dist">'+esc(fmt("near.km",{d:fmtKm(x[0])}))+"</span>"+(p[7]?'<span>'+esc(t("near.tel"))+' <span style="direction:ltr;unicode-bidi:isolate;font-weight:700;user-select:all">'+esc(p[7])+"</span></span>":"")+'<a href="'+gmaps(p[5]+","+p[6])+'" target="_blank" rel="noopener">'+esc(t("map.btn0"))+"</a></li>";
        }).join("")+"</ul>";
        if(all.length>lim&&lim<18)h+='<div class="actions"><button type="button" class="btn sec" data-act="more">'+esc(t("near.more"))+"</button></div>";
        h+='<p class="note-s">'+esc(t(n.keys[0]==="hopital"?"near.hosp":"near.call"))+" "+esc(t("near.source"))+"</p>";
      }
    }
  }
  if(n.links)h+='<h2 class="sub-h">'+esc(t("links.useful"))+'</h2><div class="langs-list">'+n.links.map(function(l){return '<a href="'+l[1]+'" target="_blank" rel="noopener" style="font-family:var(--f-latin)">'+esc(l[0])+"</a>";}).join("")+"</div>";
  return h;
}
function vFiche(){
  var id=FICHE;
  var blk=function(h,k){return '<div class="fblock"><h3>'+esc(t(h))+"</h3><p>"+esc(t(k))+"</p></div>";};
  return backBtn(FROM==="sim"?"res.title":"aides.all",FROM==="sim"?"tores":"aides")+
    '<div class="rhead">'+icc(AID_ICON[id])+'<h1 tabindex="-1" class="vfocus" style="font-size:clamp(1.5rem,4.5vw,2rem)">'+esc(t("pl."+id))+"</h1></div>"+
    blk("f.what",id+".what")+blk("f.who",id+".who")+blk("f.how",id+".how")+
    '<details class="pro"><summary>'+esc(t("f.pro"))+'</summary><div class="pro-body fr" lang="fr">'+PRO[id]+"</div></details>";
}
function vPhrases(){
  return backBtn("nav.home","home")+'<div class="view-head"><h1 tabindex="-1" class="vfocus">'+esc(t("nav.phrases"))+'</h1><p class="lead">'+esc(t("ph.intro"))+"</p></div>"+
    PHRASES.map(function(p,i){
      var fr=p.fr.replace("{lang}",langFr());
      return '<article class="phrase"><p class="say fr" lang="fr">'+esc(fr)+"</p>"+(L==="fr"?"":'<p class="meaning">'+esc(t(p.k))+"</p>")+'<div class="actions"><button type="button" class="btn" data-ph="'+i+'">'+svg("bubble",22)+esc(t("ph.big"))+"</button></div></article>";
    }).join("");
}
function vContacts(){
  var num=function(n,k,urg){return '<li class="num'+(urg?" urg":"")+'"><span class="n">'+n+"</span><span>"+esc(t(k))+"</span></li>";};
  return backBtn("nav.home","home")+'<div class="view-head"><h1 tabindex="-1" class="vfocus">'+esc(t("home.contacts"))+"</h1></div>"+
    '<h2 class="sub-h">'+esc(t("ct.urg"))+'</h2><ul class="nums">'+num("15","num15",1)+num("112","num112",1)+num("114","num114",1)+"</ul>"+
    '<p class="box">'+esc(t("urgent"))+"</p>"+
    '<h2 class="sub-h">'+esc(t("ct.other"))+'</h2><ul class="nums">'+num("115","num115")+num("119","num119")+num("36 46","num3646")+"</ul>"+
    '<h2 class="sub-h">'+esc(t("ct.orgs"))+'</h2><p class="box">'+esc(t("ct.pass"))+'</p><ul class="orgs">'+ORGS.map(function(o){
      var name=o[1]?'<a class="o-name" href="'+o[1]+'" target="_blank" rel="noopener">'+esc(o[0])+"</a>":'<span class="o-name">'+esc(o[0])+"</span>";
      return "<li>"+name+'<span class="o-desc">'+esc(t(o[2]))+"</span></li>";
    }).join("")+"</ul>"+
    '<details class="src"><summary>'+esc(t("src.title"))+'</summary><p style="margin-bottom:12px">'+esc(t("src.checked"))+'</p><ol class="fr" lang="fr">'+SOURCES.map(function(x){return '<li><a href="'+x[0]+'" target="_blank" rel="noopener">'+esc(x[1])+"</a></li>";}).join("")+"</ol></details>";
}

function render(focus){
  document.querySelectorAll("[data-t]").forEach(function(el){el.textContent=t(el.getAttribute("data-t"));});
  document.getElementById("tnote").hidden=(L==="fr");
  document.getElementById("ovClose").textContent=t("ph.close");
  document.querySelectorAll("#langs button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-l")===L?"true":"false");});
  document.querySelectorAll("[data-size]").forEach(function(b){b.setAttribute("aria-pressed",+b.getAttribute("data-size")===SIZE?"true":"false");b.setAttribute("aria-label",t("size.label")+" "+b.getAttribute("data-size"));});
  var html={home:vHome,sim:vSim,aides:vAides,fiche:vFiche,phrases:vPhrases,contacts:vContacts,lieux:vLieux,lieu:vLieu,info:vInfo}[VIEW]();
  app.innerHTML='<div class="view">'+html+"</div>";
  if(focus){window.scrollTo(0,0);var f=app.querySelector(".vfocus");if(f)f.focus({preventScroll:true});}
}
function go(v){VIEW=v;render(true);}

/* ---------- Évènements ---------- */
app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.go){if(b.dataset.go==="sim"){DONE=false;STEP=0;}go(b.dataset.go);return;}
  if(b.dataset.fiche){FROM=VIEW==="sim"?"sim":"aides";FICHE=b.dataset.fiche;go("fiche");return;}
  if(b.dataset.ph!==undefined){openOv(b);return;}
  if(b.dataset.lieu){FROM_L=VIEW==="sim"?"sim":"lieux";LIEU=b.dataset.lieu;go("lieu");return;}
  if(b.dataset.info){INFO=b.dataset.info;go("info");return;}
  if(b.dataset.pick!==undefined){LOC=locFrom(LOC.cands[+b.dataset.pick]);render(false);focusLoc();return;}
  if(b.dataset.k){
    s[b.dataset.k]=b.dataset.v;if(!visible().duree)s.duree=null;if(!visible().cas)s.cas=null;
    var st=steps(),i=st.indexOf(b.dataset.k)+1;
    if(i>=st.length)DONE=true;else STEP=i;
    render(true);return;
  }
  var a=b.dataset.act;
  if(a==="home")go("home");
  else if(a==="lieux")go("lieux");
  else if(a==="locchange"){var keep=LOC&&LOC.label?LOC.label.replace(/\s\(.*\)$/,""):"";LOC={text:keep};render(false);var li=document.getElementById("loc");if(li){li.focus();li.select();}}
  else if(a==="more"){MORE[LIEU]=(MORE[LIEU]||3)+5;render(false);}
  else if(a==="aides")go("aides");
  else if(a==="tores"){DONE=true;go("sim");}
  else if(a==="simback"){if(DONE){DONE=false;STEP=steps().length-1;render(true);}else if(STEP>0){STEP--;render(true);}else go("home");}
  else if(a==="minus"){if(s.foyer>1){s.foyer--;render(false);app.querySelector('[data-act="minus"]').focus();}}
  else if(a==="plus"){if(s.foyer<12){s.foyer++;render(false);app.querySelector('[data-act="plus"]').focus();}}
  else if(a==="next"){var st2=steps();if(STEP+1>=st2.length)DONE=true;else STEP++;render(true);}
  else if(a==="result"){var v=document.getElementById("rev").value;s.revenu=v===""?null:Math.max(0,parseFloat(v));DONE=true;render(true);}
  else if(a==="none"){s.revenu=0;DONE=true;render(true);}
  else if(a==="dk"){s.revenu=null;DONE=true;render(true);}
  else if(a==="edit"){DONE=false;STEP=0;render(true);}
  else if(a==="restart"){s={statut:null,qui:null,duree:null,cas:null,lieu:null,foyer:1,revenu:null};DONE=false;STEP=0;render(true);}
  else if(a==="toggle"){var p=document.getElementById(b.getAttribute("aria-controls"));var open=b.getAttribute("aria-expanded")!=="true";b.setAttribute("aria-expanded",open?"true":"false");p.hidden=!open;}
});
function focusLoc(){var b=app.querySelector('[data-act="locchange"]');if(b)b.focus();}
app.addEventListener("submit",function(e){
  if(e.target.id!=="locform")return;
  e.preventDefault();
  var text=document.getElementById("loc").value.trim();if(!text)return;
  LOC={status:"loading",text:text};render(false);
  loadData().then(function(d){
    if(!d){LOC={label:text,city:text};}
    else{var c=resolveLoc(text);
      if(!c.length)LOC={status:"notfound",text:text};
      else if(c.length===1)LOC=locFrom(c[0]);
      else LOC={status:"choose",text:text,cands:c};}
    render(false);
    if(LOC.label)focusLoc();else{var f=app.querySelector("[data-pick]")||document.getElementById("loc");if(f)f.focus();}
  });
});
app.addEventListener("keydown",function(e){if(e.target.id==="rev"&&e.key==="Enter"){e.preventDefault();app.querySelector('[data-act="result"]').click();}});
document.getElementById("brand").addEventListener("click",function(){go("home");});
document.querySelectorAll("[data-size]").forEach(function(b){b.addEventListener("click",function(){SIZE=+b.dataset.size;document.documentElement.style.fontSize=[112.5,130,150][SIZE-1]+"%";store("size",String(SIZE));render(false);});});
document.getElementById("langs").innerHTML=LANGS.map(function(x){return '<button type="button" data-l="'+x.k+'" lang="'+x.lang+'" dir="'+x.dir+'" aria-pressed="false">'+x.label+"</button>";}).join("");
document.getElementById("langs").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setLang(b.dataset.l,true);});
function setLang(k,save){var x=LANGS.filter(function(l){return l.k===k;})[0];if(!x)return;L=k;document.documentElement.lang=x.lang;document.documentElement.dir=x.dir;document.title=t("name");if(save)store("lang",k);render(false);}

var ov=document.getElementById("overlay"),lastBtn=null;
function openOv(b){lastBtn=b;var p=PHRASES[+b.dataset.ph];document.getElementById("ovText").textContent=p.fr.replace("{lang}",langFr());ov.hidden=false;document.getElementById("ovClose").focus();}
function closeOv(){ov.hidden=true;if(lastBtn&&document.body.contains(lastBtn))lastBtn.focus();}
document.getElementById("ovClose").addEventListener("click",closeOv);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!ov.hidden)closeOv();});

/* ---------- Démarrage ---------- */
var h=(location.hash||"").replace("#",""),z=load("size");
if(z&&+z>=1&&+z<=3){SIZE=+z;document.documentElement.style.fontSize=[112.5,130,150][SIZE-1]+"%";}
var VIEWS={simulateur:"sim",aides:"aides",phrases:"phrases",contacts:"contacts",lieux:"lieux"};
if(VIEWS[h])VIEW=VIEWS[h];
setLang(LANGS.some(function(x){return x.k===h;})?h:(load("lang")||"fr"),false);
window.addEventListener("hashchange",function(){var k=(location.hash||"").replace("#","");if(LANGS.some(function(x){return x.k===k;}))setLang(k,true);else if(VIEWS[k])go(VIEWS[k]);});
})();
</script>

</body></html>
